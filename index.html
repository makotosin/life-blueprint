<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人生再点火設計インタビュー Ver1.2</title><link rel="stylesheet" href="style.css"></head><body><main class="app-shell">
<section id="start" class="screen active"><div class="symbol">✦</div><p class="eyebrow">人生再点火プロジェクト</p><h1>人生再点火<br>設計インタビュー</h1><p class="lead">22項目から、現在地・未来・制約・暗示のカードを整理します。</p><button id="startBtn" class="primary">インタビューを始める</button></section>
